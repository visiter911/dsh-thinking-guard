name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test test/dsml.test.mjs test/dsml-split.test.mjs test/seam.test.mjs test/wrap.test.mjs test/dedupe.test.mjs test/letme.test.mjs test/test.mjs test/provider-replay.test.mjs
